# Per-environment values that aren't per-source (sources.yml handles those).
# config_loader.py picks the block matching the active bundle target, and
# every string field here becomes a ${placeholder} usable in sources.yml --
# e.g. raw_schema below is used as ${raw_schema} in sources.yml paths.
#
# raw_schema/bronze_schema exist separately from `catalog` because DABs
# mode: development auto-prefixes schema names per-target (dev_<user>_raw,
# dev_<user>_bronze) while mode: production does not -- so unlike `catalog`,
# these can legitimately differ between dev and test/prod even though they
# name conceptually "the same" schema.

# dev:
#   catalog: vstone_traffic_dev
#   raw_schema: dev_<user>_raw          # matches whatever dev's actual mode produces
#   bronze_schema: dev_<user>_bronze
#   audit_schema: dev_<user>_audit

# test:
#   catalog: vstone_traffic_test
#   raw_schema: raw
#   bronze_schema: bronze
#   audit_schema: audit

# prod:
#   catalog: vstone_traffic_prod
#   raw_schema: raw
#   bronze_schema: bronze
#   audit_schema: audit

dev:
  catalog: vstone_traffic_dev
  raw_schema: dev_rohitrathodcomp_raw
  bronze_schema: dev_rohitrathodcomp_bronze
  audit_schema: dev_rohitrathodcomp_audit

test:
  catalog: vstone_traffic_test
  raw_schema: raw
  bronze_schema: bronze
  audit_schema: audit

prod:
  catalog: vstone_traffic_prod
  raw_schema: raw
  bronze_schema: bronze
  audit_schema: audit
