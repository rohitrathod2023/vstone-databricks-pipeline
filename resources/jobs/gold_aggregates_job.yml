# Gold aggregates job -- named by function (gold_monthly_traffic_summary,
# gold_street_risk_summary), not by build day. All Gold tables (dims, facts,
# aggregates) are defined in the one DLT pipeline
# (src/pipelines/gold/dlt_gold_tables.py / gold_dlt_pipeline), so this job's
# pipeline_task points at the same pipeline as gold_job -- DLT's own
# dependency graph and incremental engine already ensure only what actually
# changed gets recomputed on a refresh. This job exists as its own named,
# function-scoped entry point so the business aggregates can be triggered or
# scheduled independently of the raw dimension/fact build.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run gold_aggregates_job -t dev

resources:
  jobs:
    gold_aggregates_job:
      name: "Gold Aggregates"
      tags:
        project: vstone-traffic
        layer: gold
        scope: aggregates

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${bundle.target}

      tasks:
        - task_key: gold_dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_dlt_pipeline.id}

      email_notifications:
        on_failure:
          - ${var.notification_email}

      max_concurrent_runs: 1
