# Day 1 job. Deploy + run this immediately after writing it — don't wait until
# later days to find out the yaml is wrong:
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run data_chunking_job -t dev
#
# Two tasks, real orchestration: download_raw_data (Kaggle -> Volume) runs
# first, chunk_cars_csv depends on it -- the whole Day 1 pipeline runs
# end-to-end from nothing, no manual notebook run required first. Display
# name stays exactly "Data Chunking" (the brief requires this literal name)
# even though the job now does two things.
#
# Both tasks default force to "false" (skip if already done) -- pass
# --params '{"force": "true"}' at run time to force either task to redo its
# work regardless of what's already present.
#
# No job_clusters / new_cluster / existing_cluster_id below is intentional —
# omitting a cluster spec on a task runs it on serverless compute, which is
# required on Free Edition (no managed clusters allowed). If your workspace
# rejects this and insists on an explicit environment, add an `environments:`
# block back in — see https://docs.databricks.com/aws/en/dev-tools/bundles/resources

resources:
  jobs:
    data_chunking_job:
      name: "Data Chunking"
      tags:
        project: vstone-traffic
        layer: ingestion
        day: "1"

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${bundle.target}

      tasks:
        - task_key: download_raw_data
          notebook_task:
            notebook_path: ../../src/notebooks/00_download_raw_data.py
            base_parameters:
              catalog: ${var.catalog}
              env: ${bundle.target}
              files: "cars.csv,streets.csv,node_locations.csv,streets_list.csv,telegram.csv"
              force: "false"

        - task_key: chunk_cars_csv
          depends_on:
            - task_key: download_raw_data
          notebook_task:
            notebook_path: ../../src/notebooks/01_data_chunking.py
            base_parameters:
              catalog: ${var.catalog}
              env: ${bundle.target}
              force: "false"

      email_notifications:
        on_failure:
          - ${var.notification_email}

      max_concurrent_runs: 1
