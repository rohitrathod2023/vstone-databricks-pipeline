[flake8]
max-line-length = 120
exclude = .git,__pycache__,src/notebooks,src/pipelines/bronze/dlt_traffic_counts.py,src/pipelines/silver/dlt_silver_tables.py
# Databricks notebook .py files use magic comments (# MAGIC, # COMMAND ----------)
# and notebook-injected globals (spark, dbutils) that flake8 doesn't understand —
# excluded from lint rather than suppressed line-by-line everywhere. DLT pipeline
# source files (dlt_traffic_counts.py, dlt_silver_tables.py) have the same
# injected-globals issue (spark) despite living under src/pipelines/ rather than
# src/notebooks/, so they're excluded individually instead of excluding the whole
# (otherwise lintable) bronze/ or silver/ package.
extend-ignore = E203,W503
