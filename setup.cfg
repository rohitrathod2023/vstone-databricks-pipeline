[flake8]
max-line-length = 120
exclude = .git,__pycache__,src/notebooks
# Databricks notebook .py files use magic comments (# MAGIC, # COMMAND ----------)
# and notebook-injected globals (spark, dbutils) that flake8 doesn't understand —
# excluded from lint rather than suppressed line-by-line everywhere.
extend-ignore = E203,W503
